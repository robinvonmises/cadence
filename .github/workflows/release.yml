name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, an den die App gehängt wird (z. B. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version setzen
        run: |
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist || true

      - name: Tests (CadenceCore)
        run: swift test --filter CadenceCoreTests

      - name: App bauen
        run: ./scripts/build-app.sh

      - name: App verpacken
        run: ditto -c -k --keepParent build/Cadence.app build/Cadence.zip

      - name: Release anlegen bzw. App anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Cadence.zip --clobber
          else
            NOTES=".github/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
            gh release create "$TAG" build/Cadence.zip --title "Cadence ${TAG#v}" "${ARGS[@]}"
          fi

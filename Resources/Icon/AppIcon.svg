<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS-Raster: Squircle 824 × 824 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  </g>

  <!-- hintere Sprechblase (die Gegenseite) -->
  <g opacity="0.35">
    <path d="M430 262 h300 a90 90 0 0 1 90 90 v150 a90 90 0 0 1 -90 90 h-40 l10 70 l-85 -70 h-185 a90 90 0 0 1 -90 -90 v-150 a90 90 0 0 1 90 -90 z" fill="#FFFFFF"/>
  </g>

  <!-- vordere Sprechblase (du) mit Wellenform -->
  <g filter="url(#soft)">
    <path d="M294 382 h340 a96 96 0 0 1 96 96 v176 a96 96 0 0 1 -96 96 h-210 l-104 82 l14 -82 h-40 a96 96 0 0 1 -96 -96 v-176 a96 96 0 0 1 96 -96 z" fill="#FFFFFF"/>
  </g>
  <g fill="url(#bars)">
    <rect x="300" y="530" width="34" height="72" rx="17"/>
    <rect x="356" y="488" width="34" height="156" rx="17"/>
    <rect x="412" y="452" width="34" height="228" rx="17"/>
    <rect x="468" y="506" width="34" height="120" rx="17"/>
    <rect x="524" y="470" width="34" height="192" rx="17"/>
    <rect x="580" y="514" width="34" height="104" rx="17"/>
    <rect x="636" y="540" width="34" height="52" rx="17"/>
  </g>
</svg>
